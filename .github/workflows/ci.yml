name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A PR stacked on another
  # PR's branch otherwise gets no CI at all, which is exactly when it is most
  # wanted: a stacked branch is the one whose base is still moving.
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Cover the macOS/clang build path on the newest Python.
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mageck2 (compiles the RRA helper)
        run: python -m pip install --upgrade pip && pip install .[test]

      - name: Run smoke tests
        run: pytest -v

  rra-parity:
    # The suite is run against both RRA implementations, not just the default
    # one. The Python implementation is now the default, so the job above
    # already covers it; this job covers the compiled helper, and runs the
    # Python path again explicitly so that a change to the default cannot
    # quietly reduce what is tested to a single implementation.
    #
    # One Python version is enough: what is under test is agreement between
    # two implementations of the same statistic, which does not vary by
    # interpreter version, and the matrix above already covers the versions.
    name: RRA parity (MAGECK2_RRA_IMPL=${{ matrix.rra-impl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rra-impl: [python, cpp]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install mageck2 (compiles the RRA helper)
        run: python -m pip install --upgrade pip && pip install .[test]

      - name: Run the suite against MAGECK2_RRA_IMPL=${{ matrix.rra-impl }}
        env:
          MAGECK2_RRA_IMPL: ${{ matrix.rra-impl }}
        run: pytest -v
