name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A PR stacked on another
  # PR's branch otherwise gets no CI at all, which is exactly when it is most
  # wanted: a stacked branch is the one whose base is still moving.
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Cover the macOS/clang build path on the newest Python.
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mageck2 (compiles the RRA helper)
        run: python -m pip install --upgrade pip && pip install .[test]

      - name: Run smoke tests
        run: pytest -v

  parity:
    # The suite is run against both implementations of both helpers, not just
    # whichever pair is currently the default. Both defaults are now the
    # Python ports, so the job above already covers that side; this job covers
    # the compiled helpers, and runs the Python side again explicitly so that
    # a change to either default cannot quietly reduce what is tested to a
    # single implementation.
    #
    # The two switches move together rather than as a 2x2 matrix. What they
    # select is the integration path -- which implementation `mageck2 test`
    # and `mageck2 pathway` actually call -- and that path is independent for
    # the two helpers, so the cross combinations add runner time without
    # adding coverage. Agreement between each helper and its port is checked
    # by tests/test_rra_parity.py and tests/test_gsea_parity.py, which drive
    # both backends directly and so run in either configuration.
    #
    # One Python version is enough: what is under test is agreement between
    # two implementations of the same statistic, which does not vary by
    # interpreter version, and the matrix above already covers the versions.
    name: Parity (MAGECK2_*_IMPL=${{ matrix.impl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        impl: [python, cpp]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install mageck2 (compiles both helpers)
        run: python -m pip install --upgrade pip && pip install .[test]

      - name: Run the suite against MAGECK2_*_IMPL=${{ matrix.impl }}
        env:
          MAGECK2_RRA_IMPL: ${{ matrix.impl }}
          MAGECK2_GSEA_IMPL: ${{ matrix.impl }}
        run: pytest -v
