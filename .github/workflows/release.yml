name: Release

# Build the source distribution, prove it installs from scratch (compiling the
# bundled RRA C++ helper), and publish to PyPI via Trusted Publishing (OIDC) —
# no API tokens are stored in the repository.
#
# Triggers:
#   * Publishing a GitHub Release  -> build, verify, publish to PyPI.
#   * Manual "Run workflow"        -> build, verify, publish to TestPyPI (dry run).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  verify:
    name: Install from sdist / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Install the built sdist (compiles RRA) and run smoke tests
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          # Install strictly from the built tarball, not the checkout.
          python -m pip install dist/*.tar.gz
          # The sdist ships the tests; run them against the installed package.
          tar xzf dist/*.tar.gz
          pytest -v mageck2-*/tests

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
